services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netscan
      POSTGRES_USER: netscan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netscan_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://netscan:${DB_PASSWORD:-netscan_dev}@db:5432/netscan
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      WORKERS: ${WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
