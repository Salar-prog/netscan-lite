services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netscan
      POSTGRES_USER: netscan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netscan"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://netscan:${DB_PASSWORD}@db:5432/netscan
      LDAP_ENABLED: "true"
      LDAP_SERVER: ${LDAP_SERVER}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-"(sAMAccountName={username})"}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WORKERS: ${WORKERS:-4}
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
