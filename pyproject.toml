[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netscan-lite"
version = "0.1.0"
description = "Lightweight IP discovery with quarantine logic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ns-lite contributors" },
]
dependencies = [
    "click>=8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "gunicorn>=21.2",
    "sqlmodel>=0.0.14",
    "pydantic-settings>=2.0",
    "ldap3>=2.9",
    "PyJWT>=2.8",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]
docs = ["mkdocs-material>=9.0"]

[project.scripts]
ns-lite = "netscan_lite.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["netscan_lite"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
